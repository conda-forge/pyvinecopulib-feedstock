{% set name = "pyvinecopulib" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyvinecopulib-{{ version }}.tar.gz
  sha256: f1fd655d563463ee30a30c12c2389a9047d3b6ea9bec0ca1845d601f1e46b99d
  patches:
    - patches/0001-find-versioned-libclang-on-windows.patch

build:
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:

  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make

  host:
    - python
    - pip
    - scikit-build-core >=0.5.0
    - nanobind >=2.7.0
    - python-clang >=18,<19
    - numpy >=2.0
    - matplotlib-base >=3.0
    - networkx >=3.0
    - array-api-compat >=1.7
    - eigen >=3.4,<5
    - libboost-headers >=1.75

  run:
    - python
    - numpy >=2.0
    - matplotlib-base >=3.0
    - networkx >=3.0
    - pydot >=3.0
    - array-api-compat >=1.7

  run_constrained:
    - scipy >=1.16
    - scikit-learn >=1.4
    - pandas >=2.0
    - pytorch >=2.2

test:
  source_files:
    - tests
    - scripts/generate_stubs.py

  requires:
    - pip
    - pytest >=8
    - pytest-cov
    - pytest-rerunfailures
    - pytest-xdist >=3.6
    - scipy >=1.16
    - scikit-learn >=1.4
    - pandas >=2.0
    - pytorch >=2.2

  commands:
    - pip check
    - pytest tests -r a -m "not compile"

about:
  home: https://github.com/vinecopulib/pyvinecopulib
  summary: A python interface to vinecopulib
  description: |
    pyvinecopulib is the Python interface to vinecopulib, a header-only C++ library for vine copula models based on Eigen. It provides inference algorithms for both bivariate and vine copula models, with nonparametric and multi-parameter families, scikit-learn-compatible estimators, and an extensible protocol-based architecture for custom bivariate and vine copula implementations, including native PyTorch backends.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://pyvinecopulib.readthedocs.io
  dev_url: https://github.com/vinecopulib/pyvinecopulib

extra:
  recipe-maintainers:
    - tvatter
