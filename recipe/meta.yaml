{% set name = "pyvinecopulib" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyvinecopulib-{{ version }}.tar.gz
  sha256: c3bb46512f7280e6ba56451a1e974e774a01571738566cd72cdb8874b525c348

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
    - eigen
    - libboost-python-devel
  host:
    - python
    - scikit-build-core >=0.5.0
    - nanobind >=2.7.0
    - pip
  run:
    - python
    - numpy >=1.14
    - matplotlib-base >=3.0
    - networkx >=3.0
    - pydot >=3.0

test:
  imports:
    - pyvinecopulib
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://vinecopulib.github.io/pyvinecopulib
  summary: A python interface to vinecopulib
  description: |
    pyvinecopulib is the Python interface to vinecopulib, a header-only C++ library for vine copula models based on Eigen. It provides inference algorithms for both bivariate and vine copula models, with nonparametric and multi-parameter families, scikit-learn-compatible estimators, and an extensible protocol-based architecture for custom bivariate and vine copula implementations, including native PyTorch backends.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://vinecopulib.github.io/pyvinecopulib/
  dev_url: https://github.com/vinecopulib/pyvinecopulib

extra:
  recipe-maintainers:
    - tvatter
